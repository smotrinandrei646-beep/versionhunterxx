name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: '21'
      - run: dotnet workload install maui-android
      - run: dotnet publish VersionHunterX.csproj -f net10.0-android -c Release -p:AndroidPackageFormat=apk
      - uses: actions/upload-artifact@v4
        with:
          name: VersionHunterX-apk
          path: |
            **/publish/*-Signed.apk
            **/publish/*.apk
            
